<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Container Setup */
        .animation-container {
        display: flex;
        align-items: center;
        gap: 30px;
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
        overflow-x: hidden; /* Prevents horizontal scrollbars during animation */
        }

        /* Image styling */
        .slide-left {
        width: 50%;
        height: auto;
        border-radius: 8px;
        /* Animation: name | duration | timing-function | fill-mode */
        animation: slideFromLeft 1.2s ease-out forwards;
        }

        /* Paragraph styling */
        .slide-right {
        width: 50%;
        font-size: 1.1rem;
        line-height: 1.6;
        color: #333;
        animation: slideFromRight 1.2s ease-out forwards;
        }

        /* --- KEYFRAMES --- */

        /* Left Side Slide-In (Image) */
        @keyframes slideFromLeft {
        0% {
            opacity: 0;
            transform: translateX(-100%); /* Start completely offscreen to the left */
        }
        100% {
            opacity: 1;
            transform: translateX(0); /* Settle at normal position */
        }
        }

        /* Right Side Slide-In (Paragraph) */
        @keyframes slideFromRight {
        0% {
            opacity: 0;
            transform: translateX(100%); /* Start completely offscreen to the right */
        }
        100% {
            opacity: 1;
            transform: translateX(0); /* Settle at normal position */
        }
        }

    </style>
</head>
<body>
    <div class="animation-container">
        <img src="./images/profile-new.jpg" alt="Sliding Visual" class="slide-left">
        <p class="slide-right">
            This paragraph slides smoothly from the right side of the screen while the image accompanies it from the left. 
            Using pure CSS ensures excellent performance and zero JavaScript overhead.
        </p>
    </div>

</body>
</html>
